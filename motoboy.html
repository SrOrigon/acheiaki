<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b192c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Entregador</title>
    <link rel="manifest" href="manifest.json">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/acheiaki-design.css?v=1">
    <link rel="stylesheet" href="css/ajuda-visivel.css?v=2">
    <link rel="icon" type="image/jpeg" href="assets/images/acheiaki-icon.jpg">
    <style>
        :root {
            --primary: #e85d04;
            --primary-dark: #c2410c;
            --bg: #f7f6f2;
            --card: #ffffff;
            --text: #14171f;
        }

        * { box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            background: #0b192c;
        }

        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.22;
        }

        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 25, 44, 0.85);
            z-index: -1;
        }

        .container {
            background: var(--card);
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 24px 60px -16px rgba(0, 0, 0, 0.45);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(20, 23, 31, 0.08);
        }

        .logo-img {
            width: 76px;
            height: 76px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(20, 23, 31, 0.1);
            object-fit: cover;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 1.65rem;
            color: var(--text);
            font-weight: 700;
        }

        p {
            color: #4b5563;
            margin-bottom: 24px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            margin-bottom: 25px;
            font-size: 0.85rem;
            text-transform: none;
            letter-spacing: 1px;
        }

        .status-off { background: #fee2e2; color: #b91c1c; }
        .status-on { background: #d1fae5; color: #065f46; animation: pulse-green 2s infinite; }
        .status-pc { background: #e0e7ff; color: #312e81; }

        .ajuda-local {
            text-align: left;
            background: #fff7ed;
            border: 2px solid #fdba74;
            border-radius: 16px;
            padding: 14px;
            margin: 0 0 16px;
        }

        .ajuda-local p,
        .ajuda-local li {
            font-size: 1.05rem;
            margin: 0 0 10px;
            color: #7c2d12;
        }

        .ajuda-local ol {
            margin: 0;
            padding-left: 22px;
        }

        .btn-ajuste {
            display: block;
            width: 100%;
            min-height: 56px;
            margin-top: 8px;
            border-radius: 16px;
            background: #111827;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 56px;
            text-align: center;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .btn-track {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(249, 113, 54, 0.3);
            text-transform: none;
            letter-spacing: 0;
            min-height: 60px;
        }

        .btn-track:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(249, 113, 54, 0.4);
        }

        .btn-track:active { transform: scale(0.98); }

        @media (max-width: 640px) {
            body { padding: max(12px, env(safe-area-inset-top)) 12px max(20px, env(safe-area-inset-bottom)); justify-content: flex-start; min-height: 100dvh; }
            .container { padding: 22px 16px; border-radius: 18px; max-width: 100%; }
            h1 { font-size: 1.45rem; }
        }

        .btn-track.active {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            text-align: center;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(249, 113, 54, 0.1); }

        .coords {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 20px;
            background: #f9fafb;
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body data-pagina="motoboy">
    <img src="assets/images/hero-bg.png" class="bg-image" alt="Background">
    <div class="bg-overlay"></div>

    <div class="container">
        <img src="assets/images/placeholder-logo.svg" data-bind="logo" alt="Logo" class="logo-img">
        <h1>Entregador</h1>
        <p data-bind="nome">Nome da Sua Loja</p>
        <p id="texto-local">Escolha o pedido e toque em Começar a entrega.</p>
        <div class="ajuda-visivel-bloco" id="entregador-ajuda-intro">O cliente vê no mapa onde você está. Sempre permita o GPS quando o celular pedir.</div>

        <div class="form-group" style="width: 100%; margin-bottom: 20px;">
            <p id="entregador-ajuda-lista" class="ajuda-visivel-bloco" style="margin-bottom:12px;"></p>
            <label style="display: block; margin-bottom: 8px; font-size: 1.15rem; color: #111; font-weight: 800;">Qual pedido você vai levar?</label>
            <select id="select-pedido" style="width: 100%; padding: 15px; border: 2px solid var(--primary); border-radius: 12px; font-size: 1.1em; font-family: inherit; background: white; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-weight: 600;">
                <option value="">🔥 Carregando pedidos...</option>
            </select>
            
            <div class="ajuda-id-manual">
                <label for="order-id">Não achei o pedido na lista</label>
                <p id="entregador-ajuda-sem-pedido" style="margin:0 0 10px;font-size:1.05rem;color:#374151;"></p>
                <input type="number" id="order-id" placeholder="Digite o número do pedido" style="width: 100%; padding: 14px; border: 2px solid #d1d5db; border-radius: 12px; font-size: 1.1rem; margin-bottom: 0;">
            </div>
        </div>

        <p id="entregador-ajuda-gps" class="ajuda-visivel-bloco" style="font-size:1.05rem;"></p>
        <div id="status-display" class="status-badge status-off">Preparando a localização</div>
        <div id="ajuda-local" class="ajuda-local" hidden>
            <p id="ajuda-texto"></p>
            <ol id="passos-local"></ol>
            <button type="button" id="btn-pedir-local" class="btn-track">Pedir a localização de novo</button>
            <a id="btn-abrir-ajuste" class="btn-ajuste" hidden>Abrir a localização do celular</a>
        </div>

        <button id="toggle-tracking" class="btn-track">Começar a entrega</button>

        <div id="order-info-card" class="order-card" style="display: none; margin-top: 20px; text-align: left; background: rgba(255, 255, 255, 0.9); padding: 20px; border-radius: 20px; border: 1px solid rgba(249, 113, 54, 0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.05); backdrop-filter: blur(5px);">
            <h4 style="margin: 0 0 15px 0; color: var(--primary); border-bottom: 2px solid #fff7ed; padding-bottom: 8px; font-size: 1.1em; display: flex; align-items: center; gap: 10px;"><i class="fa-solid fa-truck-fast"></i> Detalhes da Entrega</h4>
            <div id="order-details-content" style="font-size: 0.95em; line-height: 1.5; color: #374151;">
                <!-- Conteúdo injetado via JS -->
            </div>
        </div>

        <div id="coords-display" class="coords" hidden>Aguardando sinal...</div>
        <a id="link-voltar-painel-motoboy" href="painel.html" style="display: block; margin-top: 20px; color: #111827; text-decoration: none; font-size: 1.1rem; font-weight: 700;">Voltar aos pedidos</a>
    </div>

    <script src="js/tenant.js"></script>
    <script src="js/store-loader.js"></script>
    <script src="js/celulas-sync.js"></script>
    <script src="js/native-bridge.js"></script>
    <script src="js/realtime-client.js"></script>
    <script>PedidoZapStore.load({ fallbackStatic: true, silent: true }).catch(function(){});</script>
    <script src="js/ajuda-loja.js?v=1"></script>
    <script src="js/motoboy.js?v=20"></script>
</body>
</html>
