<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AcheIAki</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b192c; color: #fff; display: grid; place-items: center; min-height: 100vh; text-align: center; padding: 24px; }
    .box { max-width: 340px; }
    .spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #f97316; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { margin-top: 14px; background: #f97316; color: #fff; border: none; border-radius: 12px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2 style="margin:0 0 8px;">AcheIAki</h2>
    <p id="status" style="margin:0;color:#cbd5e1;font-size:0.95rem;">Conectando ao seu marketplace regional...</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
  <script>
    setTimeout(function () {
      var st = document.getElementById('status');
      if (st) st.textContent = 'Verifique sua internet ou abra novamente em instantes.';
    }, 6000);
  </script>
</body>
</html>
